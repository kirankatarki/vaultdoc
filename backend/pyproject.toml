[project]
name="epub-docx-converter-backend"
version="0.1.0"
description="File conversion and encryption API"
requires-python=">=3.11, <3.14"
dependencies= [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pyzipper",
    "PyMuPDF",
    "python-docx",
]

[build-system]
requires=["hatchling"]
build-backend="hatchling:build"

[tool.hatch.build.targets.wheel]
packages = ["."]